services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dipstick
      POSTGRES_USER: dipstick
      POSTGRES_PASSWORD: dipstick
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipstick -d dipstick"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DEVELOPMENT ONLY -- do not deploy to production environments
  oidc:
    build: ./docker/oidc
    ports:
      # persona-login design.md D11: loopback-only. The generic short-syntax
      # "4011:4011" binds to all host interfaces by default; the
      # login_hint-aware auto-approve handler (docker/oidc/interactions.js)
      # turns an unauthenticated GET carrying login_hint=<account-id> into a
      # full sign-in with no credential of any kind, so this port must not
      # be reachable beyond the machine running the stack.
      # postgres/redis have the same underlying exposure but are out of
      # scope here -- pre-existing, unrelated to authentication, tracked
      # separately (design.md Risks).
      - "127.0.0.1:4011:4011"
    environment:
      OIDC_ISSUER: http://localhost:4011
      OIDC_CLIENT_ID: dipstick-local
      OIDC_CLIENT_SECRET: dipstick-local-secret
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4011/.well-known/openid-configuration || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
